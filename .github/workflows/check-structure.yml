name: Check and publish cases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initial_baseline:
        description: 'First setup ONLY: only if no successful publication history exists; full SHA already synced to S3'
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Hold one lock across admission, all resource checks, upload and finalization.
# GitHub queues up to 100 waiters; the admission gate detects gaps/failed runs.
concurrency:
  group: case-publish-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  check-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      proceed: ${{ steps.admit.outputs.proceed }}
      before: ${{ steps.admit.outputs.before }}
      after: ${{ steps.admit.outputs.after }}
      has_uploads: ${{ steps.plan.outputs.has_uploads }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Reject native reruns and non-main manual recovery
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Native reruns are disabled. Use workflow_dispatch on main.' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Manual recovery must target main.' >&2
            exit 1
          fi

      - name: Check out the fixed event target and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit this batch under the shared serial lock
        id: admit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_BASELINE: ${{ inputs.initial_baseline }}
        run: python3 .github/scripts/publication_state.py enter

      - name: Fix the check range
        id: range
        if: github.event_name == 'pull_request' || steps.admit.outputs.proceed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.admit.outputs.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || steps.admit.outputs.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$TARGET_SHA")
          fi
          echo "before=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "after=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Check directories declared by added or modified manifest entries
        id: directories
        if: github.event_name == 'pull_request' || steps.admit.outputs.proceed == 'true'
        env:
          BASE_SHA: ${{ steps.range.outputs.before }}
        run: python3 .github/scripts/check_structure.py directories --base "$BASE_SHA"

      - name: Check matching manifest entries and package sources
        if: steps.directories.outputs.cases != '' && steps.directories.outputs.cases != '[]'
        env:
          CASES_JSON: ${{ steps.directories.outputs.cases }}
          CASE_FILE_BASE_URL: https://raw.githubusercontent.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check_structure.py manifest

      - name: Check local SHA declarations in added or modified manifest entries
        if: github.event_name == 'pull_request' || steps.admit.outputs.proceed == 'true'
        env:
          BASE_SHA: ${{ steps.range.outputs.before }}
          TARGET_SHA: ${{ steps.range.outputs.after }}
        run: python3 .github/scripts/check_structure.py declarations --base "$BASE_SHA" --after "$TARGET_SHA"

      - name: Test workflow behavior on pull requests
        if: github.event_name == 'pull_request'
        run: python3 -B -m unittest discover -s .github/tests -v

      - name: Prepare uploads from the checked manifest difference
        id: plan
        if: steps.admit.outputs.proceed == 'true'
        env:
          BEFORE_SHA: ${{ steps.admit.outputs.before }}
          AFTER_SHA: ${{ steps.admit.outputs.after }}
        run: python3 .github/scripts/publish.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --prepare "$RUNNER_TEMP/publication-plan.json"

  publish:
    needs: check-structure
    if: needs.check-structure.outputs.has_uploads == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject native reruns even when previous check outputs are reused
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Native reruns are disabled. Use workflow_dispatch on main.' >&2
            exit 1
          fi

      - name: Check out the checked target version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-structure.outputs.after }}
          persist-credentials: false

      - name: Restore the manifest upload plan
        env:
          PLAN_JSON: ${{ needs.check-structure.outputs.plan }}
        run: python3 -c 'import os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "publication-plan.json").write_text(os.environ["PLAN_JSON"], encoding="utf-8")'

      - name: Download and extract changed science packages
        env:
          CASE_FILE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.check-structure.outputs.after }}
        run: python3 .github/scripts/extract_science.py --plan "$RUNNER_TEMP/publication-plan.json" --output "$RUNNER_TEMP/science-publication"

      - name: Replace extracted content and upload resources, then manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_TARGET_FOLDER: ${{ secrets.AWS_TARGET_FOLDER }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_PAGER: ""
        run: python3 .github/scripts/publish.py --apply-plan "$RUNNER_TEMP/publication-plan.json"

  finalize:
    needs: [check-structure, publish]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Reject native reruns before finalization
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Native reruns are disabled. Use workflow_dispatch on main.' >&2
            exit 1
          fi

      - name: Check out the fixed event target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publication result and cancel waiters
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/publication_state.py finish
