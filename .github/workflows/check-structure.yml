name: Check case structure

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check-structure:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed tree and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test the checker
        run: python3 -B -m unittest discover -s .github/tests -v

      - name: Check new directories
        id: directories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          args=(--base "$BASE_SHA")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--merge-base)
          elif [[ "$BRANCH_NAME" != "$DEFAULT_BRANCH" ]]; then
            args+=(--new-branch-base "refs/remotes/origin/$DEFAULT_BRANCH")
          fi
          python3 .github/scripts/check_structure.py directories "${args[@]}"

      - name: Check matching manifest entries
        env:
          CASES_JSON: ${{ steps.directories.outputs.cases }}
        run: python3 .github/scripts/check_structure.py manifest
