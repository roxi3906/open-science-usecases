name: publish

on:
  workflow_call:
    inputs:
      before:
        required: true
        type: string
      after:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_DEFAULT_REGION:
        required: true
      AWS_TARGET_FOLDER:
        required: true

permissions:
  contents: read

# The calling check workflow owns the queue for the entire check-publish cycle.
# Do not acquire that same concurrency group again inside this reusable workflow.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_TARGET_FOLDER: ${{ secrets.AWS_TARGET_FOLDER }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_uploads: ${{ steps.plan.outputs.has_uploads }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out the validated push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.after }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare uploads and compare candidate objects with S3
        id: plan
        env:
          BEFORE_SHA: ${{ inputs.before }}
          AFTER_SHA: ${{ inputs.after }}
        run: python3 .github/scripts/publish.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --prepare "$RUNNER_TEMP/publication-plan.json"

  publish:
    needs: prepare
    if: needs.prepare.outputs.has_uploads == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the validated push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.after }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the original push plan
        env:
          PLAN_JSON: ${{ needs.prepare.outputs.plan }}
        run: python3 -c 'import os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "publication-plan.json").write_text(os.environ["PLAN_JSON"], encoding="utf-8")'

      - name: Publish local resources to S3
        run: python3 .github/scripts/publish.py --apply-plan "$RUNNER_TEMP/publication-plan.json"
